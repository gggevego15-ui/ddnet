name: Build Worst Client

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package runnable client
        shell: pwsh
        run: |
          $package = "package/WorstClient"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "build/Release/DDNet.exe" "$package/DDNet.exe"
          Copy-Item "data" "$package/data" -Recurse
          Copy-Item "storage.cfg" "$package/storage.cfg"
          if (Test-Path "build/Release/*.dll") {
            Copy-Item "build/Release/*.dll" $package
          }
          @(
            "Worst Client - Windows",
            "",
            "Run DDNet.exe from this folder. Keep the data folder and storage.cfg next to it.",
            "Do not move DDNet.exe out of this folder."
          ) | Set-Content "$package/README.txt"

      - name: Upload runnable package
        uses: actions/upload-artifact@v4
        with:
          name: WorstClient-Windows
          path: package/WorstClient/**
          if-no-files-found: error
