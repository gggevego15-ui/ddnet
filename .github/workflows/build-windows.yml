```yaml
name: Build Worst Client

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_GENERATOR_PLATFORM=x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find executables
        shell: pwsh
        run: |
          Write-Host "Searching for EXE files..."

          Get-ChildItem -Path build -Filter *.exe -Recurse |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $files = Get-ChildItem -Path build -Filter *.exe -Recurse

          if ($files.Count -eq 0) {
            Write-Error "No EXE files were produced."
            exit 1
          }

          foreach ($file in $files) {
            Copy-Item $file.FullName artifact\$($file.Name) -Force
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WorstClient-Windows
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
```
